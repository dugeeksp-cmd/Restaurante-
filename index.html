  <style>
    body {
      font-family: 'Fredoka', sans-serif;
    }
    .accordion-content {
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
      opacity: 0;
    }
    .accordion-content.expanded {
      max-height: 4000px; /* High enough to contain all items */
      opacity: 1;
    }
    /* Smooth fade and slide up animation for children cards when parent is expanded */
    .accordion-content.expanded > div {
      animation: slideUpFade 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    
    @keyframes slideUpFade {
      from {
        opacity: 0;
        transform: translateY(15px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }
    
    /* Beautiful Lúdico Modal Animations */
    @keyframes fadeIn {
      from { opacity: 0; backdrop-filter: blur(0px); }
      to { opacity: 1; backdrop-filter: blur(4px); }
    }
    @keyframes popUp {
      0% { transform: scale(0.9) translateY(30px); opacity: 0; }
      70% { transform: scale(1.03) translateY(-4px); }
      100% { transform: scale(1) translateY(0); opacity: 1; }
    }
    .animate-fade-in {
      animation: fadeIn 0.3s ease-out forwards;
    }
    .animate-pop-up {
      animation: popUp 0.45s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    .bounce-short {
      animation: bounceShort 0.5s ease-out;
    }
    @keyframes bounceShort {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-10px); }
    }
  </style>
</head>

    // Expor as funções de clique no escopo global para o onclick inline dos botões estáticos funcionar
    window.toggleSection = function(id) {
      const el = document.getElementById("section-" + id);
      const chev = document.getElementById("chevron-" + id);
      if (el.classList.contains("expanded")) {
        el.classList.remove("expanded");
        if (chev) chev.style.transform = "rotate(0deg)";
      } else {
        el.classList.add("expanded");
        if (chev) chev.style.transform = "rotate(180deg)";
      }
    };

    window.toggleSubSection = function(id) {
      const el = document.getElementById("section-" + id);
      const chev = document.getElementById("chevron-" + id);
      if (el.classList.contains("hidden")) {
        el.classList.remove("hidden");
        if (chev) chev.style.transform = "rotate(180deg)";
      } else {
        el.classList.add("hidden");
        if (chev) chev.style.transform = "rotate(0deg)";
      }
    };

    window.changeQty = function(id, delta, itemJsonStr) {
      const item = JSON.parse(decodeURIComponent(itemJsonStr));
      const currentQty = selecao.itens[id] ? selecao.itens[id].quantidade : 0;
      const newQty = Math.max(0, currentQty + delta);

      if (newQty === 0) {
        delete selecao.itens[id];
      } else {
        selecao.itens[id] = {
          item: item,
          quantidade: newQty
        };
      }

      // Atualizar o elemento DOM local correspondente ao contador
      const counterLabel = document.getElementById("qty-" + id);
      if (counterLabel) {
        counterLabel.innerText = newQty;
      }

      atualizarResumo();
    };

    // ==========================================

    function criarCardComida(item) {
      const encodedItem = encodeURIComponent(JSON.stringify(item));
      const card = document.createElement("div");
      card.className = "flex flex-col items-center justify-between p-3.5 bg-white border-2 border-slate-200/80 rounded-2xl text-center shadow-sm hover:border-amber-300 transition-colors";
      
      card.innerHTML = `
        <span class="text-4xl mb-1">${item.emoji}</span>
        <span class="text-sm font-bold text-slate-700 uppercase tracking-tight">${item.nome}</span>
        <span class="text-xs font-black text-amber-600 mt-0.5">R$ ${item.preco.toFixed(2)}</span>
        
        <div class="flex items-center space-x-2.5 mt-3 bg-amber-50 px-2 py-1.5 rounded-full border border-amber-200">
          <button onclick="changeQty('${item.id}', -1, '${encodedItem}')" class="w-8 h-8 rounded-full bg-rose-500 text-white font-extrabold flex items-center justify-center text-lg shadow-sm hover:bg-rose-600 active:scale-90 transition-all cursor-pointer">-</button>
          <span id="qty-${item.id}" class="text-base font-black text-slate-800 w-6 text-center">0</span>
          <button onclick="changeQty('${item.id}', 1, '${encodedItem}')" class="w-8 h-8 rounded-full bg-emerald-500 text-white font-extrabold flex items-center justify-center text-lg shadow-sm hover:bg-emerald-600 active:scale-90 transition-all cursor-pointer">+</button>
        </div>
      `;
      return card;
    }

      cardapioData.porcoes.forEach(item => gridPorcoes.appendChild(criarCardComida(item)));
      
      cardapioData.bebidas.sucos.forEach(item => gridSucos.appendChild(criarCardComida(item)));
      cardapioData.bebidas.refrigerantes.forEach(item => gridRefrigerantes.appendChild(criarCardComida(item)));
      cardapioData.bebidas.milkshakes.forEach(item => gridMilkshakes.appendChild(criarCardComida(item)));
      
      cardapioData.sobremesas.forEach(item => gridSobremesas.appendChild(criarCardComida(item)));
    }

    // Escutar input da mesa
    inputMesa.addEventListener("input", (e) => {
      selecao.mesa = e.target.value;
      atualizarResumo();
    });

    // Atualizar HTML do resumo do pedido e Valor Total
    function atualizarResumo() {
      const keys = Object.keys(selecao.itens);
      let total = 0;

      if (!selecao.mesa && keys.length === 0) {
        resumoConteudo.innerHTML = `<p class="text-slate-400 text-center py-2">Nenhum item selecionado ainda...</p>`;
        valorTotalElement.innerText = "R$ 0,00";
        return;
      }

      let html = "";
      
      if (selecao.mesa) {
        html += `
          <div class="bg-amber-100/60 text-amber-800 px-3 py-2 rounded-lg font-bold text-sm mb-2 flex items-center justify-between">
            <span>📍 Mesa Selecionada:</span>
            <span class="text-md bg-amber-500 text-white px-3 py-0.5 rounded-full">Mesa ${selecao.mesa}</span>
          </div>
        `;
      } else {
        html += `
          <div class="bg-rose-50 text-rose-600 px-3 py-2 rounded-lg font-bold text-xs mb-2">
            ⚠️ Por favor, digite o número da mesa!
          </div>
        `;
      }

      if (keys.length > 0) {
        html += `<div class="space-y-1.5 pt-1">`;
        keys.forEach(key => {
          const entry = selecao.itens[key];
          const subtotal = entry.item.preco * entry.quantidade;
          total += subtotal;
          
          html += `
            <div class="flex items-center justify-between text-xs py-1.5 border-b border-slate-100">
              <div class="flex items-center gap-2">
                <span class="bg-slate-100 text-slate-800 font-black px-2 py-0.5 rounded">x${entry.quantidade}</span>
                <span class="text-base">${entry.item.emoji}</span>
                <span class="font-bold text-slate-700">${entry.item.nome}</span>
              </div>
              <span class="font-black text-slate-600">R$ ${subtotal.toFixed(2)}</span>
            </div>
          `;
        });
        html += `</div>`;
      } else {
        html += `<p class="text-slate-400 text-center py-2 text-xs">Aguardando escolhas de comida...</p>`;
      }

      resumoConteudo.innerHTML = html;
      valorTotalElement.innerText = `R$ ${total.toFixed(2)}`;
    }

    // Limpar seleções após o envio
    function limparFormulario() {
      selecao.mesa = "";
      selecao.itens = {};
      
      inputMesa.value = "";
      
      // Reiniciar contadores no DOM
      document.querySelectorAll("[id^='qty-']").forEach(counter => {
        counter.innerText = "0";
      });

      atualizarResumo();
    }

    // ==========================================
    // 🚀 ENVIAR PEDIDO PARA O FIRESTORE
    // ==========================================
    btnEnviar.addEventListener("click", async () => {
      if (!selecao.mesa) {
        alert("Ops! Por favor, digite o número da mesa antes de enviar o pedido.");
        inputMesa.focus();
        return;
      }

      const keys = Object.keys(selecao.itens);
      if (keys.length === 0) {
        alert("Escolha a quantidade de pelo menos uma delícia no cardápio!");
        return;
      }

      // Calcular o total e montar os itens no formato solicitado
      let total = 0;
      const itensEnviados = keys.map(key => {
        const entry = selecao.itens[key];
        const subtotal = entry.item.preco * entry.quantidade;
        total += subtotal;
        return {
          id: entry.item.id,
          nome: entry.item.nome,
          emoji: entry.item.emoji,
          quantidade: entry.item.quantidade,
          preco: entry.item.preco,
          subtotal: subtotal
        };
      });

      const novoPedido = {
        mesa: parseInt(selecao.mesa),
        itens: itensEnviados,
        valorTotal: total,
        status: "pendente",
        timestamp: isFirebaseConfigured ? serverTimestamp() : new Date().toISOString()
      };

      try {
        if (isFirebaseConfigured) {
          const docRef = await addDoc(collection(db, "pedidos_brincadeira"), novoPedido);
          pedidosEnviados.add(docRef.id);
          salvarPedidosSessao();
          registrarPedidoRecente(novoPedido, docRef.id);
        } else {
          // Modo Simulado Local fallback
          const pedidosLocais = JSON.parse(localStorage.getItem('pedidos_locais') || '[]');
          const idSimulado = "sim_" + Math.random().toString(36).substring(2, 9);
          const pedidoSimulado = { id: idSimulado, ...novoPedido };
          pedidosLocais.push(pedidoSimulado);
          localStorage.setItem('pedidos_locais', JSON.stringify(pedidosLocais));
          
          pedidosEnviados.add(idSimulado);
          salvarPedidosSessao();
          registrarPedidoRecente(novoPedido, idSimulado);
          window.dispatchEvent(new Event('storage'));
        }

        alert("🚀 Pedido enviado com sucesso para a cozinha! Bom apetite!");
        limparFormulario();
      } catch (error) {
        console.error("Erro ao enviar o pedido: ", error);
        alert("Ops, não consegui enviar para o Firebase. Verifique a configuração.");
      }
    });

    // ==========================================
    // 🔔 REAL-TIME SNAPSHOT
    // ==========================================
    function monitorarPedidosProntos() {
      if (isFirebaseConfigured) {
        onSnapshot(collection(db, "pedidos_brincadeira"), (snapshot) => {
          snapshot.docChanges().forEach((change) => {
            if (change.type === "modified") {
              const pedido = change.doc.data();
              const pedidoId = change.doc.id;
              
              if (pedido.status === "pronto" && pedidosEnviados.has(pedidoId)) {
                mostrarAlertaPronto(pedido.mesa);
                marcarPedidoRecenteComoPronto(pedidoId);
                pedidosEnviados.delete(pedidoId);
                salvarPedidosSessao();
              }
            }
          });
        });
      } else {
        window.addEventListener("storage", () => {
          const pedidosLocais = JSON.parse(localStorage.getItem('pedidos_locais') || '[]');
          pedidosLocais.forEach(pedido => {
            if (pedido.status === "pronto" && pedidosEnviados.has(pedido.id)) {
              mostrarAlertaPronto(pedido.mesa);
              marcarPedidoRecenteComoPronto(pedido.id);
              pedidosEnviados.delete(pedido.id);
              salvarPedidosSessao();
            }
          });
        });
        
        setInterval(() => {
          window.dispatchEvent(new Event('storage'));
        }, 2000);
      }
    }

    function mostrarAlertaPronto(numeroMesa) {
      modalTexto.innerHTML = `
        Atenção Garçom!<br>
        O pedido da <span class="text-green-600 font-extrabold text-2xl">Mesa ${numeroMesa}</span> está pronto! 🍔🍕🍦
      `;
      modalPronto.classList.remove("hidden");
      tocarSomNotificacao();
    }

    btnFecharModal.addEventListener("click", () => {
      modalPronto.classList.add("hidden");
    });

    function tocarSomNotificacao() {
      try {
        const context = new (window.AudioContext || window.webkitAudioContext)();
        const osc1 = context.createOscillator();
        const gain1 = context.createGain();
        osc1.type = "sine";
        osc1.frequency.setValueAtTime(880, context.currentTime);
        gain1.gain.setValueAtTime(0.3, context.currentTime);
        gain1.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 0.8);
        osc1.connect(gain1);
        gain1.connect(context.destination);
        osc1.start();
        osc1.stop(context.currentTime + 0.8);
        
        setTimeout(() => {
          const osc2 = context.createOscillator();
          const gain2 = context.createGain();
          osc2.type = "sine";
          osc2.frequency.setValueAtTime(1320, context.currentTime);
          gain2.gain.setValueAtTime(0.3, context.currentTime);
          gain2.gain.exponentialRampToValueAtTime(0.01, context.currentTime + 1.2);
          osc2.connect(gain2);
          gain2.connect(context.destination);
          osc2.start();
          osc2.stop(context.currentTime + 1.2);
        }, 150);
      } catch (e) {}
    }

    // ==========================================
    // ⏱️ GESTÃO DE PEDIDOS RECENTES (ÚLTIMOS 5)
    // ==========================================
    function registrarPedidoRecente(novoPedido, idDoPedido) {
      let recentes = JSON.parse(localStorage.getItem('pedidos_recentes_sessao_garcom') || '[]');
      const pedidoRecente = {
        id: idDoPedido,
        mesa: novoPedido.mesa,
        itens: novoPedido.itens,
        valorTotal: novoPedido.valorTotal,
        status: novoPedido.status,
        timestamp: new Date().toISOString()
      };
      recentes.unshift(pedidoRecente);
      recentes = recentes.slice(0, 5);
      localStorage.setItem('pedidos_recentes_sessao_garcom', JSON.stringify(recentes));
      renderizarPedidosRecentes();
    }

    function marcarPedidoRecenteComoPronto(pedidoId) {
      let recentes = JSON.parse(localStorage.getItem('pedidos_recentes_sessao_garcom') || '[]');
      let mudou = false;
      recentes = recentes.map(p => {
        if (p.id === pedidoId) {
          p.status = 'pronto';
          mudou = true;
        }
        return p;
      });
      if (mudou) {
        localStorage.setItem('pedidos_recentes_sessao_garcom', JSON.stringify(recentes));
        renderizarPedidosRecentes();
      }
    }

    function renderizarPedidosRecentes() {
      const container = document.getElementById("container-pedidos-recentes");
      if (!container) return;

      let recentes = JSON.parse(localStorage.getItem('pedidos_recentes_sessao_garcom') || '[]');
      
      if (recentes.length === 0) {
        container.innerHTML = `
          <div class="text-center py-4 bg-slate-50 rounded-xl border-2 border-dashed border-amber-200/50">
            <span class="text-2xl">🧐</span>
            <p class="text-xs text-slate-400 font-bold mt-1">Nenhum pedido enviado nesta sessão ainda!</p>
          </div>
        `;
        return;
      }

      let html = "";
      recentes.forEach(p => {
        let statusAtual = p.status;
        if (!isFirebaseConfigured) {
          // No modo local, vamos ler o status em tempo real de 'pedidos_locais' caso tenha mudado
          const locais = JSON.parse(localStorage.getItem('pedidos_locais') || '[]');
          const encontrou = locais.find(l => l.id === p.id);
          if (encontrou) {
            statusAtual = encontrou.status;
          }
        }

        const formatTime = new Date(p.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        const isPronto = statusAtual === 'pronto';
        const statusBg = isPronto ? 'bg-green-100 text-green-800 border-green-200' : 'bg-amber-100 text-amber-800 border-amber-200 animate-pulse';
        const statusLabel = isPronto ? '✅ PRONTO!' : '⏳ NA COZINHA';

        const emojis = p.itens.map(i => `${i.quantidade}x ${i.emoji}`).join(' ');

        html += `
          <div class="p-3 bg-slate-50 border border-slate-200 rounded-xl flex items-center justify-between shadow-xs hover:border-amber-300 transition-colors">
            <div class="flex-1 min-w-0 pr-2">
              <div class="flex items-center gap-2 mb-1">
                <span class="text-xs font-black text-slate-700">Mesa ${p.mesa}</span>
                <span class="text-[9px] font-bold text-slate-400">${formatTime}</span>
              </div>
              <p class="text-xs font-bold text-slate-600 truncate" title="${p.itens.map(i => `${i.quantidade}x ${i.nome}`).join(', ')}">
                ${emojis}
              </p>
            </div>
            <div class="flex flex-col items-end gap-1">
              <span class="text-[10px] font-black ${statusBg} border px-2 py-0.5 rounded-full text-center">
                ${statusLabel}
              </span>
              <span class="text-xs font-black text-amber-600">R$ ${p.valorTotal.toFixed(2)}</span>
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }

    // Inicialização das Camadas
    renderizarCardapio();
    monitorarPedidosProntos();
    atualizarResumo();
    renderizarPedidosRecentes();

  </script>
</body>
</html>
